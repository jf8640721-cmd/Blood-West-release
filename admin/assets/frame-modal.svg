<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 弹窗专用：更华丽的9-slice边框 -->
  <defs>
    <g id="m-corner-tl">
      <!-- 外层回纹 -->
      <path d="M3,3 L18,3 L18,6 L6,6 L6,18 L3,18 Z" fill="#8b6828" opacity="0.85"/>
      <!-- 中层 -->
      <path d="M5,5 L15,5 L15,8 L8,8 L8,15 L5,15 Z" fill="#a08040" opacity="0.55"/>
      <!-- 内层高光 -->
      <path d="M7,7 L12.5,7 L12.5,9.5 L9.5,9.5 L9.5,12.5 L7,12.5 Z" fill="#c8a860" opacity="0.35"/>
      <!-- 角点 -->
      <circle cx="5.5" cy="5.5" r="1.8" fill="#d4b870"/>
      <circle cx="5.5" cy="5.5" r="0.8" fill="#f0d890"/>
    </g>
    <g id="m-corner-tr">
      <path d="M61,3 L46,3 L46,6 L58,6 L58,18 L61,18 Z" fill="#8b6828" opacity="0.85"/>
      <path d="M59,5 L49,5 L49,8 L56,8 L56,15 L59,15 Z" fill="#a08040" opacity="0.55"/>
      <path d="M57,7 L51.5,7 L51.5,9.5 L54.5,9.5 L54.5,12.5 L57,12.5 Z" fill="#c8a860" opacity="0.35"/>
      <circle cx="58.5" cy="5.5" r="1.8" fill="#d4b870"/>
      <circle cx="58.5" cy="5.5" r="0.8" fill="#f0d890"/>
    </g>
    <g id="m-corner-bl">
      <path d="M3,61 L18,61 L18,58 L6,58 L6,46 L3,46 Z" fill="#8b6828" opacity="0.85"/>
      <path d="M5,59 L15,59 L15,56 L8,56 L8,49 L5,49 Z" fill="#a08040" opacity="0.55"/>
      <path d="M7,57 L12.5,57 L12.5,54.5 L9.5,54.5 L9.5,51.5 L7,51.5 Z" fill="#c8a860" opacity="0.35"/>
      <circle cx="5.5" cy="58.5" r="1.8" fill="#d4b870"/>
      <circle cx="5.5" cy="58.5" r="0.8" fill="#f0d890"/>
    </g>
    <g id="m-corner-br">
      <path d="M61,61 L46,61 L46,58 L58,58 L58,46 L61,46 Z" fill="#8b6828" opacity="0.85"/>
      <path d="M59,59 L49,59 L49,56 L56,56 L56,49 L59,49 Z" fill="#a08040" opacity="0.55"/>
      <path d="M57,57 L51.5,57 L51.5,54.5 L54.5,54.5 L54.5,51.5 L57,51.5 Z" fill="#c8a860" opacity="0.35"/>
      <circle cx="58.5" cy="58.5" r="1.8" fill="#d4b870"/>
      <circle cx="58.5" cy="58.5" r="0.8" fill="#f0d890"/>
    </g>
  </defs>

  <!-- 上边双金线 -->
  <line x1="20" y1="3.5" x2="44" y2="3.5" stroke="#8b6828" stroke-width="1.2" opacity="0.7"/>
  <line x1="20" y1="5.5" x2="44" y2="5.5" stroke="#6b4820" stroke-width="0.6" opacity="0.4"/>

  <!-- 下边双金线 -->
  <line x1="20" y1="60.5" x2="44" y2="60.5" stroke="#8b6828" stroke-width="1.2" opacity="0.7"/>
  <line x1="20" y1="58.5" x2="44" y2="58.5" stroke="#6b4820" stroke-width="0.6" opacity="0.4"/>

  <!-- 左边双金线 -->
  <line x1="3.5" y1="20" x2="3.5" y2="44" stroke="#8b6828" stroke-width="1.2" opacity="0.7"/>
  <line x1="5.5" y1="20" x2="5.5" y2="44" stroke="#6b4820" stroke-width="0.6" opacity="0.4"/>

  <!-- 右边双金线 -->
  <line x1="60.5" y1="20" x2="60.5" y2="44" stroke="#8b6828" stroke-width="1.2" opacity="0.7"/>
  <line x1="58.5" y1="20" x2="58.5" y2="44" stroke="#6b4820" stroke-width="0.6" opacity="0.4"/>

  <!-- 四角 -->
  <use href="#m-corner-tl"/>
  <use href="#m-corner-tr"/>
  <use href="#m-corner-bl"/>
  <use href="#m-corner-br"/>
</svg>
