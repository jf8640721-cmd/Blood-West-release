<svg xmlns="http://www.w3.org/2000/svg" width="300" height="20" viewBox="0 0 300 20">
  <defs>
    <linearGradient id="fade-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a08040" stop-opacity="0"/>
      <stop offset="15%" stop-color="#a08040" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#c8a860" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="60%" stop-color="#c8a860" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#a08040" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a08040" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 左渐隐线 -->
  <rect x="0" y="9" width="120" height="1" fill="url(#fade-l)"/>
  <!-- 中间菱形 -->
  <polygon points="150,10 155,6 160,10 155,14" fill="#c8a860" opacity="0.8"/>
  <polygon points="150,10 153,8 156,10 153,12" fill="#d4b870" opacity="0.5"/>
  <!-- 右渐隐线 -->
  <rect x="180" y="9" width="120" height="1" fill="url(#fade-r)"/>
  <!-- 副线（下） -->
  <rect x="20" y="12" width="100" height="0.5" fill="url(#fade-l)" opacity="0.4"/>
  <rect x="180" y="12" width="100" height="0.5" fill="url(#fade-r)" opacity="0.4"/>
</svg>
