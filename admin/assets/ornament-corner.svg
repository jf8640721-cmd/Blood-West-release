  <rect width="120" height="120" fill="transparent"/>

  <!-- 左上角 -->
  <use href="#ruyi-tl" x="0" y="0"/>
  <!-- 右上角：镜像翻转到右上 -->
  <use href="#ruyi-tr" x="0" y="0"/>
  <!-- 左下角 -->
  <use href="#ruyi-bl" x="0" y="0"/>
  <!-- 右下角 -->
  <use href="#ruyi-br" x="0" y="0"/>
