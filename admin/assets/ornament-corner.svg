      <path d="M110,6 Q108,5 107,7 Q106,9 108,11 Q110,12 111,10 Q112,8 110,6Z"
            fill="#b89650" opacity="0.5"/>
      <circle cx="113.5" cy="6.5" r="1" fill="#c8a860" opacity="0.7"/>
    </g>
    <g id="ruyi-bl">
      <path d="M8,116 Q12,118 16,116 Q18,114 16,110 Q14,106 10,106 Q5,106 4,110 Q3,114 5,116 Q6,117 8,116Z"
            fill="none" stroke="#a08040" stroke-width="1.2" opacity="0.8"/>
      <path d="M10,114 Q12,115 13,113 Q14,111 12,109 Q10,108 9,110 Q8,112 10,114Z"
