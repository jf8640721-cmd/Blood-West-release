      <circle cx="6.5" cy="113.5" r="1" fill="#c8a860" opacity="0.7"/>
    </g>
    <g id="ruyi-br">
      <path d="M112,116 Q108,118 104,116 Q102,114 104,110 Q106,106 110,106 Q115,106 116,110 Q117,114 115,116 Q114,117 112,116Z"
            fill="none" stroke="#a08040" stroke-width="1.2" opacity="0.8"/>
      <path d="M110,114 Q108,115 107,113 Q106,111 108,109 Q110,108 111,110 Q112,112 110,114Z"
