      <circle cx="6.5" cy="6.5" r="1" fill="#c8a860" opacity="0.7"/>
    </g>
    <g id="ruyi-tr">
      <path d="M112,4 Q108,2 104,4 Q102,6 104,10 Q106,14 110,14 Q115,14 116,10 Q117,6 115,4 Q114,3 112,4Z"
