<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- 基础噪波 -->
    <filter id="leather" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55 0.45" numOctaves="5" seed="3" result="noise"/>
      <!-- 将噪波映射到暗暖色调 -->
      <feColorMatrix type="matrix" in="noise" result="toned"
        values="0.08  0.02  0    0   0.02
                0.05  0.03  0    0   0.01
                0.03  0.01  0    0   0.01
                0     0     0    0.3 0"/>
      <!-- 柔化 -->
      <feGaussianBlur in="toned" stdDeviation="0.3" result="blurred"/>
      <!-- 叠加到暗底上 -->
      <feComponentTransfer in="blurred" result="boosted">
        <feFuncA type="linear" slope="1.8" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#0a0806" filter="url(#leather)"/>
</svg>
