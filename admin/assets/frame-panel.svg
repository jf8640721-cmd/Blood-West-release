<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- 9-slice 中式边框：四角回纹 + 四边金线 -->
  <defs>
    <!-- 角花图案（回纹简化版） -->
    <g id="corner-tl">
      <path d="M2,2 L14,2 L14,4 L4,4 L4,14 L2,14 Z" fill="#9a7840" opacity="0.9"/>
      <path d="M3,3 L12,3 L12,5 L5,5 L5,12 L3,12 Z" fill="#b89650" opacity="0.6"/>
      <circle cx="4" cy="4" r="1.2" fill="#c8a860"/>
    </g>
    <g id="corner-tr">
      <path d="M46,2 L34,2 L34,4 L44,4 L44,14 L46,14 Z" fill="#9a7840" opacity="0.9"/>
      <path d="M45,3 L36,3 L36,5 L43,5 L43,12 L45,12 Z" fill="#b89650" opacity="0.6"/>
      <circle cx="44" cy="4" r="1.2" fill="#c8a860"/>
    </g>
    <g id="corner-bl">
      <path d="M2,46 L14,46 L14,44 L4,44 L4,34 L2,34 Z" fill="#9a7840" opacity="0.9"/>
      <path d="M3,45 L12,45 L12,43 L5,43 L5,36 L3,36 Z" fill="#b89650" opacity="0.6"/>
      <circle cx="4" cy="44" r="1.2" fill="#c8a860"/>
    </g>
    <g id="corner-br">
      <path d="M46,46 L34,46 L34,44 L44,44 L44,34 L46,34 Z" fill="#9a7840" opacity="0.9"/>
      <path d="M45,45 L36,45 L36,43 L43,43 L43,36 L45,36 Z" fill="#b89650" opacity="0.6"/>
      <circle cx="44" cy="44" r="1.2" fill="#c8a860"/>
    </g>
  </defs>

  <!-- 上边 -->
  <line x1="16" y1="2" x2="32" y2="2" stroke="#8b6828" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="3.5" x2="32" y2="3.5" stroke="#6b4820" stroke-width="0.5" opacity="0.4"/>

  <!-- 下边 -->
  <line x1="16" y1="46" x2="32" y2="46" stroke="#8b6828" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="44.5" x2="32" y2="44.5" stroke="#6b4820" stroke-width="0.5" opacity="0.4"/>

  <!-- 左边 -->
  <line x1="2" y1="16" x2="2" y2="32" stroke="#8b6828" stroke-width="1" opacity="0.7"/>
  <line x1="3.5" y1="16" x2="3.5" y2="32" stroke="#6b4820" stroke-width="0.5" opacity="0.4"/>

  <!-- 右边 -->
  <line x1="46" y1="16" x2="46" y2="32" stroke="#8b6828" stroke-width="1" opacity="0.7"/>
  <line x1="44.5" y1="16" x2="44.5" y2="32" stroke="#6b4820" stroke-width="0.5" opacity="0.4"/>

  <!-- 四角 -->
  <use href="#corner-tl"/>
  <use href="#corner-tr"/>
  <use href="#corner-bl"/>
  <use href="#corner-br"/>
</svg>
